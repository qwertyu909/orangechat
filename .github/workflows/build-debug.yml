name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Rewrite submodule URLs to HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Init submodules
        run: |
          git submodule update --init --recursive --depth 1 || true
          git submodule status
          ls -la material3/material-color-utilities 2>/dev/null | head -20 || echo "M3 submodule missing"

      - name: Fallback fetch material-color-utilities
        run: |
          if [ ! -d material3/material-color-utilities/kotlin ]; then
            rm -rf material3/material-color-utilities
            git clone --depth 1 https://github.com/material-foundation/material-color-utilities.git material3/material-color-utilities
          fi
          ls material3/material-color-utilities/kotlin | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Stub google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "orangechat-build",
              "storage_bucket": "orangechat-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.orangechat"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Prepare web-ui standalone pnpm
        run: |
          rm -f pnpm-workspace.yaml package.json package-lock.json bun.lock
          npm install -g pnpm@9
          pnpm --version

      - name: Install web deps
        run: |
          cd web-ui
          rm -f pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile

      - name: Build web UI
        run: |
          cd web-ui
          pnpm run build

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -la app/debug.keystore

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30